<svg xmlns="http://www.w3.org/2000/svg"
     width="24"
     height="24"
     viewBox="0 0 24 24">
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Text { color:#232629; }
    .ColorScheme-Background { color:#eff0f1; }
    .ColorScheme-Highlight { color:#3daee9; }
  </style>

  <!-- Broad background halo separates the cloud from any folder color. -->
  <path class="ColorScheme-Background"
        fill="none"
        stroke="currentColor"
        stroke-width="4"
        stroke-linejoin="round"
        d="M18.7 10.1A6.9 6.9 0 0 0 5.8 8.8
           5.5 5.5 0 0 0 6.5 19h11.8
           a4.5 4.5 0 0 0 .4-8.9Z"/>

  <!-- Crisp foreground contour plus the actual semantic cloud fill. -->
  <path class="ColorScheme-Text"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linejoin="round"
        d="M18.7 10.1A6.9 6.9 0 0 0 5.8 8.8
           5.5 5.5 0 0 0 6.5 19h11.8
           a4.5 4.5 0 0 0 .4-8.9Z"/>

  <path class="ColorScheme-Highlight"
        fill="currentColor"
        d="M18.7 10.1A6.9 6.9 0 0 0 5.8 8.8
           5.5 5.5 0 0 0 6.5 19h11.8
           a4.5 4.5 0 0 0 .4-8.9Z"/>
</svg>
